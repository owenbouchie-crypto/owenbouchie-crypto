<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-label="OWENLOOP — Co-Founder, Perpetual Technologies">
  <defs>
    <linearGradient id="rule" x1="0" x2="1">
      <stop offset="0" stop-color="#d4a537" stop-opacity="0"/>
      <stop offset=".5" stop-color="#d4a537" stop-opacity=".75"/>
      <stop offset="1" stop-color="#d4a537" stop-opacity="0"/>
    </linearGradient>

    <!-- highlight that travels along the two hairlines, matching the dividers -->
    <linearGradient id="sweep" x1="0" x2="1">
      <stop offset="0"   stop-color="#f7e3ac" stop-opacity="0"/>
      <stop offset=".47" stop-color="#f7e3ac" stop-opacity=".9"/>
      <stop offset=".5"  stop-color="#fff3cf" stop-opacity="1"/>
      <stop offset=".53" stop-color="#f7e3ac" stop-opacity=".9"/>
      <stop offset="1"   stop-color="#f7e3ac" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-1 0; 1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- the two upright rules: a soft gold body plus a highlight that runs down them -->
    <linearGradient id="vrule" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#d4a537" stop-opacity="0"/>
      <stop offset=".28" stop-color="#6b5420" stop-opacity=".7"/>
      <stop offset=".72" stop-color="#6b5420" stop-opacity=".7"/>
      <stop offset="1"   stop-color="#d4a537" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="vsweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#f7e3ac" stop-opacity="0"/>
      <stop offset=".45" stop-color="#f7e3ac" stop-opacity=".85"/>
      <stop offset=".5"  stop-color="#fff3cf" stop-opacity="1"/>
      <stop offset=".55" stop-color="#f7e3ac" stop-opacity=".85"/>
      <stop offset="1"   stop-color="#f7e3ac" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="0 -1; 0 1" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f0d0a"/>
      <stop offset="1" stop-color="#080705"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2d488"/>
      <stop offset="55%" stop-color="#d4a537"/>
      <stop offset="100%" stop-color="#b3882c"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="200" fill="url(#field)"/>

  <!-- the two upright rules, animated to match the horizontals -->
  <rect x="55.5" y="0" width="1" height="200" fill="url(#vrule)"/>
  <rect x="55.2" y="0" width="1.6" height="200" fill="url(#vsweep)"/>
  <rect x="943.5" y="0" width="1" height="200" fill="url(#vrule)"/>
  <rect x="943.2" y="0" width="1.6" height="200" fill="url(#vsweep)"/>

  <!-- top and bottom hairlines, with a highlight travelling along each -->
  <rect x="56" y="48" width="888" height="1" fill="url(#rule)"/>
  <rect x="56" y="47.7" width="888" height="1.6" fill="url(#sweep)"/>
  <rect x="56" y="152" width="888" height="1" fill="url(#rule)"/>
  <rect x="56" y="151.7" width="888" height="1.6" fill="url(#sweep)"/>

  <text x="500" y="107" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="50" fill="url(#ink)" letter-spacing="7">OWEN BOUCHIE</text>

  <text x="500" y="135" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace"
        font-size="11" fill="#8b949e" letter-spacing="6">CO-FOUNDER · PERPETUAL TECHNOLOGIES</text>

  <!-- three-dot motif, repeated in the dividers; breathes in sequence -->
  <g fill="#d4a537">
    <circle cx="484" cy="166" r="2">
      <animate attributeName="opacity" values=".25;1;.25" dur="2.7s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="166" r="2">
      <animate attributeName="opacity" values=".25;1;.25" dur="2.7s" begin=".9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="516" cy="166" r="2">
      <animate attributeName="opacity" values=".25;1;.25" dur="2.7s" begin="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
