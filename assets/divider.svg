<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 12" width="1000" height="12" role="presentation">
  <defs>
    <!-- the resting rule: static, so the divider never disappears -->
    <linearGradient id="base" x1="0" x2="1">
      <stop offset="0"    stop-color="#d4a537" stop-opacity="0"/>
      <stop offset=".18"  stop-color="#6b5420" stop-opacity=".55"/>
      <stop offset=".5"   stop-color="#8a6b28" stop-opacity=".8"/>
      <stop offset=".82"  stop-color="#6b5420" stop-opacity=".55"/>
      <stop offset="1"    stop-color="#d4a537" stop-opacity="0"/>
    </linearGradient>

    <!-- the travelling highlight -->
    <linearGradient id="sweep" x1="0" x2="1">
      <stop offset="0"   stop-color="#f2d488" stop-opacity="0"/>
      <stop offset=".45" stop-color="#f7e3ac" stop-opacity=".95"/>
      <stop offset=".5"  stop-color="#fff3cf" stop-opacity="1"/>
      <stop offset=".55" stop-color="#f7e3ac" stop-opacity=".95"/>
      <stop offset="1"   stop-color="#f2d488" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-1 0; 1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <!-- resting rule -->
  <rect x="0" y="5.4" width="1000" height="1.2" fill="url(#base)"/>

  <!-- highlight passing along it -->
  <rect x="0" y="5.1" width="1000" height="1.8" fill="url(#sweep)"/>

  <!-- centre diamonds, breathing gently out of phase with each other -->
  <g fill="#d4a537">
    <rect x="488" y="3.2" width="5.4" height="5.4" transform="rotate(45 490.7 5.9)">
      <animate attributeName="opacity" values="1;.35;1" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="507" y="3.2" width="5.4" height="5.4" transform="rotate(45 509.7 5.9)">
      <animate attributeName="opacity" values=".35;1;.35" dur="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
